name: Deploy public website to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-pages.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_PLATFORM_URL: ${{ vars.NEXT_PUBLIC_PLATFORM_URL }}
          NEXT_PUBLIC_WEBSITE_LEADS_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_LEADS_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - uses: actions/deploy-pages@v4
        id: deployment
