services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saqr
      POSTGRES_PASSWORD: saqr_local_only
      POSTGRES_DB: saqr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - saqr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saqr -d saqr']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  saqr_postgres:
